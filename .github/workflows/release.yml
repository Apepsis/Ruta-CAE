# Push a tag like v1.0.0 → builds the desktop installers (Windows, macOS, Linux)
# and the browser-extension zip, and attaches them to a GitHub Release.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node tools/sync-extension.cjs
      - run: cd extension && zip -qr ../ruta-cae-extension.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: ruta-cae-extension.zip
          draft: true
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: macos-latest, args: '--target aarch64-apple-darwin'}
          - {platform: macos-latest, args: '--target x86_64-apple-darwin'}
          - {platform: ubuntu-22.04, args: ''}
          - {platform: windows-latest, args: ''}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: {workspaces: './desktop/src-tauri -> target'}
      - run: npm install --no-audit --no-fund
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: npx tauri
          tagName: ${{ github.ref_name }}
          releaseName: 'Ruta CAE ${{ github.ref_name }}'
          releaseBody: 'Desktop installers for Windows (.msi/.exe), macOS (.dmg) and Linux (.AppImage/.deb), plus the browser extension (ruta-cae-extension.zip). The web version is on GitHub Pages.'
          releaseDraft: true
          args: ${{ matrix.args }}
