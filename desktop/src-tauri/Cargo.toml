[package]
name = "ruta-cae"
version = "1.0.0"
description = "Ruta CAE — C1 Advanced study platform (desktop)"
authors = ["Ruta CAE"]
license = "AGPL-3.0-or-later"
edition = "2021"

[lib]
name = "ruta_cae_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
